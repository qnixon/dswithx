# Test, build, and (on main) deploy. One workflow, so deploy can wait on tests
# with `needs:` instead of chaining workflows.
#
# Pushes to other branches and pull requests test only the languages their
# changes affect. Pushes to main test every language before deploying, so a
# broken implementation can never reach the site.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if [ "$ALL" = "true" ]; then
            languages=$(python3 harness/ci_plan.py --all)
          else
            languages=$(python3 harness/ci_plan.py --base "$BASE")
          fi
          echo "Languages to test: $languages"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.languages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    name: test (${{ matrix.language }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Building an image downloads its toolchain from snapshot.debian.org or
      # Docker Hub, and both turn requests away when busy. So each image is
      # cached under a hash of languages/<lang>/, everything that goes into
      # it, and rebuilt only when that folder changes. The weekly full test
      # still builds from scratch.
      - id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image.tar
          key: image-${{ matrix.language }}-${{ hashFiles(format('languages/{0}/**', matrix.language)) }}
      - if: steps.image.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/image.tar"
      - run: >-
          python3 harness/run_tests.py --language ${{ matrix.language }}
          ${{ steps.image.outputs.cache-hit == 'true' && '--skip-build' || '' }}
      # Save a freshly built image even if a test failed, so fixing the code
      # doesn't mean downloading the toolchain again.
      - id: save
        if: always() && steps.image.outputs.cache-hit != 'true'
        env:
          IMAGE: dswithx/${{ matrix.language }}
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - if: always() && steps.save.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image.tar
          key: ${{ steps.image.outputs.cache-primary-key }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          retention-days: 7

  deploy:
    needs: [plan, test, build]
    # `test` is skipped when no language is affected, so accept skipped but not
    # failed or cancelled. On main every language is tested, so it never skips.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !cancelled() && !failure()
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist
      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.156.0 deploy
